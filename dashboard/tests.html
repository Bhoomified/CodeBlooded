<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forecastrophe Unit Tests</title>
  <style>
    body { font-family: monospace; background: #1a1d23; color: #e8e9ec; padding: 24px; }
    h1 { color: #d49a3e; font-size: 18px; margin-bottom: 16px; }
    .test-pass { color: #3da576; margin: 4px 0; }
    .test-fail { color: #d94848; margin: 4px 0; font-weight: bold; }
    .summary { margin-top: 16px; padding-top: 12px; border-top: 1px solid #2a2d35; }
  </style>
</head>
<body>
  <h1>Forecastrophe Test Suite</h1>
  <div id="results">Running tests...</div>

  <script type="module">
    import { computeDoySinCos } from './js/doy.js';
    import { snapToGrid, buildPerturbationTensor } from './js/shock.js';
    import { computeDifference, analyzeCausality } from './js/analysis.js';
    import { spatialStd } from './js/blur.js';
    import { latWeightedRmse } from './js/observed.js';
    import { GRID, CHANNEL_COUNT } from './js/constants.js';

    const resultsEl = document.getElementById('results');
    resultsEl.innerHTML = '';
    let passCount = 0;
    let failCount = 0;

    function assert(name, condition, extra = '') {
      const p = document.createElement('div');
      if (condition) {
        passCount++;
        p.className = 'test-pass';
        p.textContent = `PASS: ${name} ${extra}`;
      } else {
        failCount++;
        p.className = 'test-fail';
        p.textContent = `FAIL: ${name} ${extra}`;
      }
      resultsEl.appendChild(p);
    }

    async function run() {
      // 1. DOY Sin/Cos tests
      const [s1, c1] = computeDoySinCos(1);
      assert('DOY 1 Sin near 0', Math.abs(s1 - 0.017) < 0.01, `(${s1.toFixed(4)})`);
      assert('DOY 1 Cos near 1', Math.abs(c1 - 0.999) < 0.01, `(${c1.toFixed(4)})`);

      // 2. Shock SnapToGrid
      const snapped = snapToGrid({ latMin: 8.2, latMax: 19.8, lonMin: 80.1, lonMax: 91.9 });
      assert('SnapToGrid LatMin', snapped.latMin === 7.5 || snapped.latMin === 8.5);
      assert('SnapToGrid Col range valid', snapped.cols[0] <= snapped.cols[1]);

      // 3. Perturbation Tensor Builder
      const emptyLastDay = Array(6).fill(0).map(() => Array(32).fill(0).map(() => Array(36).fill(300)));
      const res = buildPerturbationTensor({
        box: snapped,
        channels: [{ index: 0, mode: 'additive', value: 3 }],
        lastInputDay: emptyLastDay
      });
      assert('Perturbation has 6 channels', res.perturbation.length === 6);
      assert('Perturbation magnitude applied', res.perturbation[0][snapped.rows[0]][snapped.cols[0]] === 3);

      // 4. Difference calculation
      const norm = new Float32Array(100).fill(10);
      const shock = new Float32Array(100).fill(13);
      const diff = computeDifference(norm, shock, 1);
      assert('Difference (13 - 10 = 3)', Math.abs(diff[0] - 3) < 1e-5);

      // 5. Spatial STD
      const sample = new Float32Array(GRID.TOTAL_CELLS);
      for (let i = 0; i < sample.length; i++) sample[i] = i % 10;
      const stdVal = spatialStd(sample, 0, 0);
      assert('Spatial STD calculation finite & positive', stdVal > 0);

      // Summary
      const summary = document.createElement('div');
      summary.className = 'summary';
      summary.textContent = `Total: ${passCount + failCount} | Passed: ${passCount} | Failed: ${failCount}`;
      resultsEl.appendChild(summary);
    }

    run();
  </script>
</body>
</html>
