<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3b0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="640" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1119" height="639" rx="18" fill="none" stroke="#d9dee6"/>

  <!-- Title -->
  <text x="32" y="44" font-size="20" font-weight="700" fill="#1b2330">Multiverse of Monsoon · system architecture</text>
  <text x="32" y="68" font-size="13" fill="#5b6472">One supervised CPU process. Every stage has a fallback, so a valid forecast is always returned.</text>

  <!-- Inference lane -->
  <rect x="24" y="88" width="1072" height="250" rx="14" fill="#f4f7fb" stroke="#dbe3ee"/>
  <text x="44" y="114" font-size="12" font-weight="700" fill="#3c6fb4" letter-spacing="1.2">INFERENCE SERVICE · serve.py + server/core.py · offline · 4 CPU · &lt; 1 GB RAM</text>

  <!-- request -->
  <rect x="44" y="134" width="124" height="74" rx="10" fill="#ffffff" stroke="#9aa3b0"/>
  <text x="106" y="160" font-size="13" font-weight="700" fill="#1b2330" text-anchor="middle">POST /simulate</text>
  <text x="106" y="179" font-size="11" fill="#5b6472" text-anchor="middle">3 days × 6 × 32 × 36</text>
  <text x="106" y="195" font-size="11" fill="#5b6472" text-anchor="middle">+ optional shock</text>

  <!-- stages -->
  <g font-size="13" text-anchor="middle">
    <rect x="196" y="134" width="118" height="74" rx="10" fill="#e6efff" stroke="#3c6fb4"/>
    <text x="255" y="160" font-weight="700" fill="#1b2330">1 · Guard</text>
    <text x="255" y="179" font-size="11" fill="#40506a">shape, steps, NaN</text>
    <text x="255" y="195" font-size="11" fill="#40506a">repair → 422 if bad</text>

    <rect x="338" y="134" width="118" height="74" rx="10" fill="#e6efff" stroke="#3c6fb4"/>
    <text x="397" y="160" font-weight="700" fill="#1b2330">2 · Shock</text>
    <text x="397" y="179" font-size="11" fill="#40506a">added to last day,</text>
    <text x="397" y="195" font-size="11" fill="#40506a">clipped to physics</text>

    <rect x="480" y="134" width="176" height="74" rx="10" fill="#dff5ef" stroke="#1f8a70" stroke-width="1.6"/>
    <text x="568" y="160" font-weight="700" fill="#1b2330">3 · Rollout engine</text>
    <text x="568" y="179" font-size="11" fill="#2d5d50">one day at a time,</text>
    <text x="568" y="195" font-size="11" fill="#2d5d50">output fed back as input</text>

    <rect x="680" y="134" width="132" height="74" rx="10" fill="#e6efff" stroke="#3c6fb4"/>
    <text x="746" y="160" font-weight="700" fill="#1b2330">4 · Climatology</text>
    <text x="746" y="176" font-weight="700" fill="#1b2330">pull</text>
    <text x="746" y="195" font-size="11" fill="#40506a">long leads → seasonal</text>

    <rect x="836" y="134" width="108" height="74" rx="10" fill="#e6efff" stroke="#3c6fb4"/>
    <text x="890" y="160" font-weight="700" fill="#1b2330">5 · Physics</text>
    <text x="890" y="179" font-size="11" fill="#40506a">envelope clip,</text>
    <text x="890" y="195" font-size="11" fill="#40506a">rain ≥ 0</text>
  </g>

  <!-- response -->
  <rect x="966" y="134" width="114" height="74" rx="10" fill="#ffffff" stroke="#9aa3b0"/>
  <text x="1023" y="160" font-size="13" font-weight="700" fill="#1b2330" text-anchor="middle">Response</text>
  <text x="1023" y="179" font-size="11" fill="#5b6472" text-anchor="middle">steps × 6 × 32 × 36</text>
  <text x="1023" y="195" font-size="11" fill="#5b6472" text-anchor="middle">+ diagnostics</text>

  <g stroke="#5b6472" stroke-width="1.6" marker-end="url(#a)">
    <line x1="168" y1="171" x2="194" y2="171"/>
    <line x1="314" y1="171" x2="336" y2="171"/>
    <line x1="456" y1="171" x2="478" y2="171"/>
    <line x1="656" y1="171" x2="678" y2="171"/>
    <line x1="812" y1="171" x2="834" y2="171"/>
    <line x1="944" y1="171" x2="964" y2="171"/>
  </g>

  <!-- fallback chain under rollout -->
  <g font-size="12" text-anchor="middle">
    <rect x="452" y="236" width="88" height="40" rx="20" fill="#1f8a70"/>
    <text x="496" y="261" font-weight="700" fill="#ffffff">CNN</text>
    <rect x="566" y="236" width="88" height="40" rx="20" fill="#ffffff" stroke="#1f8a70"/>
    <text x="610" y="261" font-weight="700" fill="#1f6e5a">Ridge</text>
    <rect x="680" y="236" width="110" height="40" rx="20" fill="#ffffff" stroke="#9aa3b0"/>
    <text x="735" y="261" font-weight="700" fill="#5b6472">Persistence</text>
  </g>
  <g stroke="#9aa3b0" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ad)">
    <line x1="568" y1="208" x2="500" y2="234"/>
    <line x1="540" y1="256" x2="564" y2="256"/>
    <line x1="654" y1="256" x2="678" y2="256"/>
  </g>
  <text x="452" y="300" font-size="11" fill="#5b6472">next model takes over if a step fails, is non-finite</text>
  <text x="452" y="316" font-size="11" fill="#5b6472">or the call nears its 3.5 s budget</text>
  <text x="44" y="256" font-size="11" fill="#5b6472">Shocked calls: the pull is</text>
  <text x="44" y="272" font-size="11" fill="#5b6472">computed from the unshocked</text>
  <text x="44" y="288" font-size="11" fill="#5b6472">run, so the shock response</text>
  <text x="44" y="304" font-size="11" fill="#5b6472">is the model's own.</text>
  <text x="836" y="282" font-size="11" fill="#5b6472">0.13 s per 10-day call (limit 5 s)</text>
  <text x="836" y="298" font-size="11" fill="#5b6472">563 MB peak RAM</text>
  <text x="836" y="314" font-size="11" fill="#5b6472">null shock = identical output</text>

  <!-- CNN detail -->
  <rect x="24" y="352" width="1072" height="118" rx="14" fill="#f3fbf8" stroke="#cfe9e0"/>
  <text x="44" y="378" font-size="12" font-weight="700" fill="#1f8a70" letter-spacing="1.2">SPEED-LIMITED RESIDUAL CNN · 0.67 M parameters · 2.7 MB</text>
  <g font-size="12" text-anchor="middle">
    <rect x="44" y="392" width="190" height="62" rx="10" fill="#ffffff" stroke="#1f8a70"/>
    <text x="139" y="416" font-weight="700" fill="#1b2330">25 input channels</text>
    <text x="139" y="436" font-size="11" fill="#2d5d50">3 days × 6 + land, terrain,</text>
    <text x="139" y="450" font-size="11" fill="#2d5d50">lat, lon, edge + season</text>

    <rect x="262" y="392" width="110" height="62" rx="10" fill="#ffffff" stroke="#1f8a70"/>
    <text x="317" y="418" font-weight="700" fill="#1b2330">1×1 stem</text>
    <text x="317" y="438" font-size="11" fill="#2d5d50">96 features</text>

    <rect x="400" y="392" width="250" height="62" rx="10" fill="#1f8a70"/>
    <text x="525" y="416" font-weight="700" fill="#ffffff">4 residual blocks</text>
    <text x="525" y="436" font-size="11" fill="#e3f5ef">2 × (3×3 conv, GroupNorm, GELU)</text>
    <text x="525" y="450" font-size="11" fill="#e3f5ef">reach ≤ 8 cells per day = speed limit</text>

    <rect x="672" y="392" width="208" height="28" rx="8" fill="#ffffff" stroke="#1f8a70"/>
    <text x="776" y="411" font-size="11.5" fill="#1b2330">State head: Δ t2m, u, v, msl, tcwv</text>
    <rect x="672" y="426" width="208" height="28" rx="8" fill="#ffffff" stroke="#1f8a70"/>
    <text x="776" y="445" fill="#1b2330">Rain head: log(1 + rain)</text>

    <rect x="902" y="392" width="178" height="62" rx="10" fill="#ffffff" stroke="#9aa3b0"/>
    <text x="991" y="416" font-weight="700" fill="#1b2330">Next day</text>
    <text x="991" y="436" font-size="11" fill="#5b6472">today + scaled change;</text>
    <text x="991" y="450" font-size="11" fill="#5b6472">starts as persistence</text>
  </g>
  <g stroke="#1f8a70" stroke-width="1.6" marker-end="url(#a)">
    <line x1="234" y1="423" x2="260" y2="423"/>
    <line x1="372" y1="423" x2="398" y2="423"/>
    <line x1="650" y1="415" x2="676" y2="406"/>
    <line x1="650" y1="431" x2="676" y2="440"/>
    <line x1="874" y1="423" x2="900" y2="423"/>
  </g>

  <!-- Training + dashboard -->
  <rect x="24" y="486" width="640" height="130" rx="14" fill="#f7f4fd" stroke="#e1d9f3"/>
  <text x="44" y="512" font-size="12" font-weight="700" fill="#6a4fb0" letter-spacing="1.2">TRAINING · offline, Kaggle T4 GPU, ≈ 16 min</text>
  <g font-size="12" text-anchor="middle">
    <rect x="44" y="526" width="132" height="72" rx="10" fill="#ffffff" stroke="#6a4fb0"/>
    <text x="110" y="551" font-weight="700" fill="#1b2330">Train 2005–18</text>
    <text x="110" y="570" font-size="11" fill="#52468a">1 → 4 → 8-day</text>
    <text x="110" y="585" font-size="11" fill="#52468a">rollout curriculum</text>
    <rect x="200" y="526" width="140" height="72" rx="10" fill="#ffffff" stroke="#6a4fb0"/>
    <text x="270" y="551" font-weight="700" fill="#1b2330">Select on 2019</text>
    <text x="270" y="570" font-size="11" fill="#52468a">by the grader's score;</text>
    <text x="270" y="585" font-size="11" fill="#52468a">EMA weights</text>
    <rect x="364" y="526" width="132" height="72" rx="10" fill="#ffffff" stroke="#6a4fb0"/>
    <text x="430" y="551" font-weight="700" fill="#1b2330">Score 2020–21</text>
    <text x="430" y="570" font-size="11" fill="#52468a">never trained on;</text>
    <text x="430" y="585" font-size="11" fill="#52468a">kit scoring code</text>
    <rect x="520" y="526" width="128" height="72" rx="10" fill="#6a4fb0"/>
    <text x="584" y="551" font-weight="700" fill="#ffffff">Model bundle</text>
    <text x="584" y="570" font-size="11" fill="#ece6fa">4.3 MB, in the repo,</text>
    <text x="584" y="585" font-size="11" fill="#ece6fa">plain git files</text>
  </g>
  <g stroke="#6a4fb0" stroke-width="1.6" marker-end="url(#a)">
    <line x1="176" y1="562" x2="198" y2="562"/>
    <line x1="340" y1="562" x2="362" y2="562"/>
    <line x1="496" y1="562" x2="518" y2="562"/>
  </g>

  <rect x="684" y="486" width="412" height="130" rx="14" fill="#fff7ec" stroke="#f1dfc2"/>
  <text x="704" y="512" font-size="12" font-weight="700" fill="#b06d12" letter-spacing="1.2">FORECASTROPHE DASHBOARD · offline browser app</text>
  <g font-size="12" text-anchor="middle">
    <rect x="704" y="526" width="172" height="72" rx="10" fill="#ffffff" stroke="#b06d12"/>
    <text x="790" y="551" font-weight="700" fill="#1b2330">Real starting days</text>
    <text x="790" y="570" font-size="11" fill="#7a5a2a">+ shock painter,</text>
    <text x="790" y="585" font-size="11" fill="#7a5a2a">kit-exact preset shocks</text>
    <rect x="900" y="526" width="176" height="72" rx="10" fill="#ffffff" stroke="#b06d12"/>
    <text x="988" y="551" font-weight="700" fill="#1b2330">Prime vs shocked</text>
    <text x="988" y="570" font-size="11" fill="#7a5a2a">difference map, kit-exact</text>
    <text x="988" y="585" font-size="11" fill="#7a5a2a">causality checks</text>
  </g>
  <g stroke="#b06d12" stroke-width="1.6" marker-end="url(#a)">
    <line x1="876" y1="562" x2="898" y2="562"/>
  </g>

  <!-- links between lanes -->
  <g stroke="#9aa3b0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ad)" fill="none">
    <path d="M584 526 C 584 500, 610 480, 640 470"/>
    <path d="M1096 551 L1108 551 L1108 171 L1082 171"/>
  </g>
  <text x="966" y="230" font-size="11" fill="#5b6472">dashboard: 2 calls</text>
  <text x="966" y="245" font-size="11" fill="#5b6472">(normal + shocked)</text>
</svg>
